[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# SummonFactory carries SummonRound's creation code; without IR it is over EIP-170's 24,576 bytes (Codex r7 #1)
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
