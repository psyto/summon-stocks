name = "summon-stocks"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
# the Worker sees every request first, so the US block covers the page too, not only the API
run_worker_first = true

[vars]
# "on" in production. .dev.vars sets it "off" locally, where wrangler's mock request.cf says US.
GEO_BLOCK = "on"
# the alerts bot's username (no @) and the site's origin for the links in its messages; empty = no links
# TELEGRAM_BOT_NAME = ""
# SITE_URL = ""

# every intent goes through one Durable Object, so nonce checks, limits and totals are exact (Codex r2 #3, #9).
# SQLite-backed, which the free plan allows.
[[durable_objects.bindings]]
name = "INTENTS"
class_name = "IntentStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IntentStore"]

# Telegram round alerts (worker/alerts.ts): who follows which demo stock, and what was last announced
[[durable_objects.bindings]]
name = "ALERTS"
class_name = "AlertStore"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AlertStore"]

# reads the demo rounds and sends what changed; does nothing until TELEGRAM_BOT_TOKEN is set
[triggers]
crons = ["* * * * *"]
